[package]
name = "modbus-manager"
version = "1.0.2"
edition = "2024"
description = "Modbus manager service"
repository = "https://github.com/zy97/modbus-manager"

[dependencies]
axum = { version = "0.8.9", features = ["json", "tokio", "tracing"] }
config = { version = "0.15.25", features = ["toml"] }
deadpool = { version = "0.13.0", features = ["managed"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.0", features = ["full"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }
tracing = { version = "0.1.44", features = ["std"] }
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.23", features = [
    "registry",
    "std",
    "env-filter",
] }

# OpenTelemetry - traces + logs via OTLP gRPC
opentelemetry = "0.32"
opentelemetry-appender-tracing = { version = "0.32", features = [
    "experimental_span_attributes",
] }
opentelemetry-http = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
