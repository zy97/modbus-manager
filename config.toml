[server]
listen_addr = "0.0.0.0:3001"

[logging]
retained_days = 30
cleanup_interval_hours = 24

[modbus]
connect_timeout_ms = 1000
reconnect_delay_ms = 500
max_connect_attempts = 3
pool_max_size = 1
operation_timeout_ms = 5000

[conveyor]
# 输送线控制配置：根据起点/终点或位置，向 PLC 读写 Modbus 寄存器，实现输送线路由下发、
# 发送成功回读、可放料检查及需要放料通知。

# 输送线路由下发规则。
# 当 /api/conveyor/write 请求中的 source 与 destination 匹配某一项时，向对应 PLC 的指定寄存器写入 value。
# 每一项字段说明：
#   source           - 起点位置编码
#   destination      - 终点位置编码
#   device           - PLC 设备地址，格式为 "IP:端口"
#   slave_id         - Modbus 从机 ID，默认为 1
#   function         - Modbus 写入功能码：0x05(写单线圈)、0x06(写单寄存器)、0x0F(写多线圈)、0x10(写多寄存器)，默认为 0x06
#   register_address - 要写入的寄存器地址
#   value            - 要写入的值
send_routes = [
    # # 2楼成品流水线,起点终点相同不通过
    { source = "5104-1-1-1", destination = "5104-1-1-1", device = "192.168.70.102:2000", function = "0x06", register_address = 10, value = 6 },
    # # 2楼成品流水线,起点终点不相同就通过，拆完箱之后终点会变
    { source = "5104-1-1-1", destination = "5105-1-1-1", device = "192.168.70.102:2000", function = "0x06", register_address = 10, value = 16 },
    # # 2楼半成品流水线副出口送至一楼入库接驳点
    { source = "5501-1-1-1", destination = "5106-1-1-1", device = "192.168.70.100:2000", function = "0x06", register_address = 10, value = 6 },
    # 2楼半成品流水线副出口送至一楼翻包区
    { source = "5501-1-1-1", destination = "5504-1-1-1", device = "192.168.70.100:2000", function = "0x06", register_address = 10, value = 6 },
    # 2楼半成品流水线主出口送至一楼入库接驳点
    { source = "5103-1-1-1", destination = "5106-1-1-1", device = "192.168.70.100:2000", function = "0x06", register_address = 11, value = 16 },
    # 2楼半成品流水线主出口送至一楼翻包区
    { source = "5103-1-1-1", destination = "5504-1-1-1", device = "192.168.70.100:2000", function = "0x06", register_address = 11, value = 16 },
    # 2楼半成品流水线主出口送至拆箱区,到时候再改成5
    { source = "5103-1-1-1", destination = "5505-1-1-1", device = "192.168.70.100:2000", function = "0x06", register_address = 11, value = 6 },
    # 2楼半成品流水线主出口送至负拆箱区
    { source = "5103-1-1-1", destination = "5507-1-1-1", device = "192.168.70.100:2000", function = "0x06", register_address = 11, value = 6 },
    # 2楼半成品流水线主出口送至靠近机房入库点
    { source = "5103-1-1-1", destination = "5101-1-1-1", device = "192.168.70.100:2000", function = "0x06", register_address = 11, value = 26 },
    # 2楼半成品流水线主出口送至离近机房入库点
    { source = "5103-1-1-1", destination = "5102-1-1-1", device = "192.168.70.100:2000", function = "0x06", register_address = 11, value = 26 },
    # 2楼半成品流水线交叉口送至拆箱区
    { source = "5502-1-1-1", destination = "5505-1-1-1", device = "192.168.70.100:2000", function = "0x06", register_address = 12, value = 6 },
    # 2楼半成品流水线交叉口送至负拆箱区
