    { source = "R005A01011", destination = "R005A01011", device = "192.168.70.237:2000", function = "0x06", register_address = 9, value = 6 },
    # 二楼M4线入口
    # 拆箱区-R001A00002  翻包区-R001A00004  产线-5021-1-1-1   打油区-R001A00001  二楼半成品流水线远离墙出口-R002A01011    二楼半成品流水线靠墙墙出口-R003A01011
