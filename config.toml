# 发送成功回读检查。
# 当 /api/conveyor/write 写入完成后，根据 source 找到对应 PLC，读取指定寄存器以确认写入是否成功。
# 每一项字段说明：
#   source           - 起点位置编码
#   device           - PLC 设备地址，格式为 "IP:端口"
#   slave_id         - Modbus 从机 ID，默认为 1
#   function         - Modbus 读取功能码：0x01(读线圈)、0x02(读离散输入)、0x03(读保持寄存器)、0x04(读输入寄存器)，默认为 0x03
#   register_address - 要读取的寄存器地址
#   quantity         - 要读取的寄存器数量，默认为 1
send_success_checks = [
    { source = "5104-1-1-1", device = "192.168.70.102:2000", function = "0x03", register_address = 3, quantity = 1 },
    { source = "5502-1-1-1", device = "192.168.70.100:2000", function = "0x03", register_address = 22, quantity = 1 },
    { source = "5503-1-1-1", device = "192.168.70.100:2000", function = "0x03", register_address = 25, quantity = 1 },
    { source = "5501-1-1-1", device = "192.168.70.100:2000", function = "0x03", register_address = 20, quantity = 1 },
    { source = "5103-1-1-1", device = "192.168.70.100:2000", function = "0x03", register_address = 21, quantity = 1 },
    { source = "5106-1-1-1", device = "192.168.70.100:2000", function = "0x03", register_address = 23, quantity = 1 },
    { source = "5107-1-1-1", device = "192.168.70.100:2000", function = "0x03", register_address = 24, quantity = 1 },
    { source = "5101-1-1-1", device = "192.168.70.100:2000", function = "0x03", register_address = 8, quantity = 1 },
    { source = "5102-1-1-1", device = "192.168.70.100:2000", function = "0x03", register_address = 7, quantity = 1 },
]


# 可放料检查。
# /api/conveyor/can-putdown 根据 location 轮询对应 PLC 的寄存器，判断该位置是否可以放料。
# 当读取到的第一个寄存器值为 6 且配置了 hook_notify 时，会触发对应的 webhook 通知。
# 每一项字段说明：
#   location         - 检查的位置编码
#   device           - PLC 设备地址，格式为 "IP:端口"
#   slave_id         - Modbus 从机 ID，默认为 1
#   function         - Modbus 读取功能码，默认为 0x03
#   register_address - 要读取的寄存器地址
#   quantity         - 要读取的寄存器数量，默认为 1
#   hook_notify      - 可选，触发 webhook 的名称，与 webhooks 中的 name 对应
can_putdown_checks = [
    { location = "5107-1-1-1", device = "192.168.70.100:2000", function = "0x03", register_address = 4, quantity = 1 },
    { location = "5103-1-1-1", device = "192.168.70.100:2000", function = "0x03", register_address = 0, quantity = 1 },
    { location = "5104-1-1-1", device = "192.168.70.102:2000", function = "0x03", register_address = 0, quantity = 1 },
    { location = "5105-1-1-1", device = "192.168.70.102:2000", function = "0x03", register_address = 1, quantity = 1 ,hook_notify = "成品拆箱回库"},

    # 二期靠过道流水线入口
    { location = "R004A01011", device = "192.168.70.237:2000", function = "0x03", register_address = 2, quantity = 1 },
    # 二期靠墙流水线入口
    { location = "R006A01011", device = "192.168.70.237:2000", function = "0x03", register_address = 0, quantity = 1 },
    # 二期二楼半成品流水线入口
    { location = "R001A01011", device = "192.168.70.235:2000", function = "0x03", register_address = 2, quantity = 1 },
    # 二期一楼成品流水线入口
    { location = "5022-1-1-1", device = "192.168.70.235:2000", function = "0x03", register_address = 16, quantity = 1 },
]


# Webhook 回调配置。
# 当可放料检查(can_putdown_checks)满足触发条件(首个寄存器值为 6 且 hook_notify 非空)时，
# 向对应的 url 发送 POST 通知，请求体为 { "location": "...", "values": [...] }。
# 每一项字段说明：
#   name - webhook 名称，与 can_putdown_checks 中的 hook_notify 对应
#   url  - 回调地址
webhooks = [
    { name = "can-putdown-test", url = "http://192.168.70.19:9992/Conveyor/CanPutdownCallback" },
    { name = "成品拆箱回库", url = "http://192.168.70.19:9992/Conveyor/FinishedPartsSplitedReturnCallback" },
]


# 需要放料时的写入规则。
# 当 /api/conveyor/need-putdown 请求中的 location 匹配某一项时，向对应 PLC 的指定寄存器写入 value。
# 每一项字段说明：
#   location         - 位置编码
#   device           - PLC 设备地址，格式为 "IP:端口"
#   slave_id         - Modbus 从机 ID，默认为 1
#   function         - Modbus 写入功能码，默认为 0x06
#   register_address - 要写入的寄存器地址
#   value            - 要写入的值
need_putdown_routes = [
    { location = "5107-1-1-1", device = "192.168.70.100:2000", function = "0x06", register_address = 16, value = 6 },
]
